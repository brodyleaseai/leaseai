[server]
# false = Streamlit opens the browser on your PC.
# Docker/Cloud still run headless via STREAMLIT_SERVER_HEADLESS=true.
headless = false
port = 8501
address = "localhost"
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "light"
