services:
  web:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      LEASEAI_ENV: production
      STREAMLIT_SERVER_HEADLESS: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
